<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Evidencias - Taller Mecánico API</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 30px 34px; background: #f5f7fa; color: #1f2933;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { margin-bottom: 18px; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -.01em; }
  .meta { font-size: 12.5px; color: #5b6b7a; }
  .meta code { background: #e8edf2; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  .tarjeta {
    background: #fff; border: 1px solid #dde4ea; border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  .linea {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #eef2f6; flex-wrap: wrap;
  }
  .metodo { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 4px 9px; border-radius: 6px; color: #fff; }
  .GET { background: #1d4ed8; } .POST { background: #15803d; }
  .PUT { background: #b45309; } .DELETE { background: #b91c1c; }
  .ruta { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #334155; word-break: break-all; }
  .estado { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .s2 { background: #15803d; } .s4 { background: #c2410c; } .s5 { background: #b91c1c; } .s3 { background: #0f766e; }
  .tiempo { font-size: 11px; color: #7b8794; }
  pre {
    margin: 0; padding: 11px 14px 13px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; line-height: 1.45; color: #334155; background: #fbfcfd;
    white-space: pre-wrap; word-break: break-word; max-height: 230px; overflow: hidden;
  }
  .pie { margin-top: 16px; font-size: 11.5px; color: #7b8794; }
  .ok { color: #15803d; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Evidencia — Código 200</h1>
  <div class="meta">
    API publicada: <code id="base"></code> · Ejecutado: <span id="fecha"></span>
  </div>
</header>
<main id="contenido"></main>
<div class="pie" id="pie"></div>

<script>
const params = new URLSearchParams(location.search);
const codigo = params.get("codigo") || "200";
const base = location.origin;
const sufijo = Date.now().toString().slice(-6);
const doc = "8" + sufijo + "0";
const placa = "E" + sufijo;
const email = `evidencia${sufijo}@correo.com`;

document.getElementById("base").textContent = base;
document.getElementById("fecha").textContent = new Date().toLocaleString("es-PE");
document.getElementById("titulo").textContent = `Evidencia — Código ${codigo}`;

const tarjetas = [];
let clienteId = null, vehiculoId = null;

const crear = (metodo, ruta, extra = {}) => ({ metodo, ruta, extra });

async function crearCliente() {
  const r = await fetch(base + "/api/clientes", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ documento: doc, nombre: "Cliente", apellido: "Evidencia", email })
  });
  if (r.ok) clienteId = (await r.clone().json()).clienteId;
  return r;
}

async function crearVehiculo() {
  const r = await fetch(base + "/api/vehiculos", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ clienteId, placa, marca: "Toyota", modelo: "Yaris", anio: 2024, color: "Blanco", kilometraje: 5000 })
  });
  if (r.ok) vehiculoId = (await r.clone().json()).vehiculoId;
  return r;
}

const grupos = {
  "200": [
    crear("GET", "/api/clientes"),
    crear("GET", "/api/clientes/1"),
    crear("GET", "/api/clientes/1/vehiculos"),
    crear("GET", "/api/vehiculos?clienteId=1&marca=Toyota")
  ],
  "201": [
    crear("POST", "/api/clientes", { cuerpo: { documento: doc, nombre: "Cliente", apellido: "Evidencia", email } }),
    crear("POST", "/api/vehiculos", { cuerpo: { clienteId: "NUEVO", placa, marca: "Toyota", modelo: "Yaris", anio: 2024, color: "Blanco", kilometraje: 5000 } })
  ],
  "204": [
    crear("PUT", "/api/clientes/{id}", { preparar: true }),
    crear("PUT", "/api/vehiculos/{id}"),
    crear("DELETE", "/api/vehiculos/{id}"),
    crear("DELETE", "/api/clientes/{id}")
  ],
  "400": [
    crear("POST", "/api/clientes", { cuerpo: { documento: "12", nombre: "" } }),
    crear("PUT", "/api/clientes/1", { cuerpo: { clienteId: 99, documento: "12345678", nombre: "Carlos", apellido: "Ramírez" } }),
    crear("POST", "/api/vehiculos", { cuerpo: { clienteId: 9999, placa: "QQQ-111", marca: "Kia", modelo: "Sportage", anio: 2022 } })
  ],
  "404": [
    crear("GET", "/api/clientes/9999"),
    crear("GET", "/api/vehiculos/9999"),
    crear("DELETE", "/api/vehiculos/9999")
  ],
  "409": [
    crear("POST", "/api/clientes", { cuerpo: { documento: "12345678", nombre: "Otro", apellido: "Cliente" } }),
    crear("POST", "/api/vehiculos", { cuerpo: { clienteId: 2, placa: "ABC-123", marca: "Toyota", modelo: "Corolla", anio: 2020 } }),
    crear("DELETE", "/api/clientes/1")
  ]
};

const metodoClase = (m) => m;
const estadoClase = (c) => (c >= 500 ? "s5" : c >= 400 ? "s4" : c === 201 ? "s3" : "s2");

function pintar(c, estado, cuerpo, ms) {
  const div = document.createElement("section");
  div.className = "tarjeta";
  div.innerHTML = `
    <div class="linea">
      <span class="metodo ${metodoClase(c.metodo)}">${c.metodo}</span>
      <span class="ruta">${c.rutaReal || c.ruta}</span>
      <span class="tiempo">${ms} ms</span>
      <span class="estado ${estadoClase(estado)}">${estado || "ERROR"}</span>
    </div>
    <pre>${cuerpo.replace(/</g, "&lt;")}</pre>`;
  document.getElementById("contenido").appendChild(div);
}

async function ejecutar() {
  const lista = grupos[codigo] || [];

  if (codigo === "201") {
    // El cliente debe existir antes del vehículo.
    const c = lista[0];
    let r = await fetch(base + c.ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(c.extra.cuerpo) });
    const t0 = performance.now();
    let cuerpo = await r.text();
    if (r.ok) clienteId = JSON.parse(cuerpo).clienteId;
    pintar(c, r.status, embellecer(cuerpo, r), 0);

    const v = lista[1];
    const cuerpoV = { ...v.extra.cuerpo, clienteId };
    const ini = performance.now();
    r = await fetch(base + v.ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpoV) });
    cuerpo = await r.text();
    pintar(v, r.status, embellecer(cuerpo, r), Math.round(performance.now() - ini));
    return;
  }

  if (codigo === "204") {
    // Preparar cliente y vehículo para actualizar y eliminar.
    await crearCliente();
    await crearVehiculo();

    const rutas = [
      base + `/api/clientes/${clienteId}`,
      base + `/api/vehiculos/${vehiculoId}`,
      base + `/api/vehiculos/${vehiculoId}`,
      base + `/api/clientes/${clienteId}`
    ];
    const cuerpos = [
      JSON.stringify({ clienteId, documento: doc, nombre: "Cliente", apellido: "Actualizado", email, activo: true }),
      JSON.stringify({ vehiculoId, clienteId, placa, marca: "Toyota", modelo: "Yaris", anio: 2024, color: "Azul", kilometraje: 6000 }),
      null, null
    ];

    for (let i = 0; i < lista.length; i++) {
      const c = lista[i];
      const ini = performance.now();
      const r = await fetch(rutas[i], { method: c.metodo, headers: { "Content-Type": "application/json" }, body: cuerpos[i] });
      const texto = await r.text();
      c.rutaReal = rutas[i].replace(base, "");
      pintar(c, r.status, texto ? texto : "(sin contenido)", Math.round(performance.now() - ini));
    }
    return;
  }

  for (const c of lista) {
    const ini = performance.now();
    const opciones = { method: c.metodo };
    if (c.extra.cuerpo) {
      opciones.headers = { "Content-Type": "application/json" };
      opciones.body = JSON.stringify(c.extra.cuerpo);
    }
    const r = await fetch(base + c.ruta, opciones);
    const texto = await r.text();
    pintar(c, r.status, texto ? embellecer(texto, r) : "(sin contenido)", Math.round(performance.now() - ini));
  }
}

function embellecer(texto, r) {
  try { return JSON.stringify(JSON.parse(texto), null, 2); } catch { return texto; }
}

ejecutar().then(() => {
  document.getElementById("pie").textContent = "Pruebas ejecutadas directamente contra la API publicada (no localhost).";
});
</script>
</body>
</html>
